{% extends 'login/base.html' %}
{% block title %}Payment Failed{% endblock %}
{% block content %}
    <h2>Payment Failed</h2>
    <p>Sorry, your payment could not be processed. Please try again.</p>
    <p>
        <a href="{% url 'payment' %}">Try Again</a> | 
        <a href="{% url 'cart' %}">Back to Cart</a> | 
        <a href="{% url 'dashboard' %}">Back to Dashboard</a>
    </p>

    <!-- Inline CSS -->
    <style>
        h2 {
            text-align: center;
            margin-top: 20px;
        }
        p {
            text-align: center;
        }
        a {
            display: inline-block;
            margin: 10px;
            padding: 8px 16px;
            background: #0d6efd;
            color: #fff;
            text-decoration: none;
            border-radius: 4px;
        }
        a:hover {
            background: #0b5ed7;
        }
    </style>
{% endblock %}
