{% extends 'login/base.html' %}
{% block title %}Register{% endblock %}
{% block content %}
<div class="row justify-content-center">
    <div class="col-md-6">
        <h2 class="text-center my-4">Register</h2>
        <form method="post" class="p-4 border rounded">
            {% csrf_token %}
            <div class="mb-3">
                <label for="user_type" class="form-label">User Type</label>
                <select name="user_type" id="user_type" class="form-select" required>
                    <option value="student">Student</option>
                    <option value="teacher">Teacher</option>
                </select>
            </div>
            <div class="mb-3">
                <label for="name" class="form-label">Name</label>
                <input type="text" name="name" id="name" class="form-control" required>
            </div>
            <div class="mb-3">
                <label for="email" class="form-label">Email</label>
                <input type="email" name="email" id="email" class="form-control" required>
            </div>
            <div class="mb-3">
                <label for="id_number" class="form-label">ID Number</label>
                <input type="text" name="id_number" id="id_number" class="form-control" required>
            </div>
            <div class="mb-3" id="department_field">
                <label for="department" class="form-label">Department</label>
                <input type="text" name="department" id="department" class="form-control">
            </div>
            <div class="mb-3">
                <label for="phone_number" class="form-label">Phone Number</label>
                <input type="tel" name="phone_number" id="phone_number" class="form-control" required>
            </div>
            <div class="mb-3">
                <label for="password" class="form-label">Password</label>
                <input type="password" name="password" id="password" class="form-control" required>
            </div>
            <div class="mb-3">
                <label for="confirm_password" class="form-label">Confirm Password</label>
                <input type="password" name="confirm_password" id="confirm_password" class="form-control" required>
            </div>
            <button type="submit" class="btn btn-primary w-100">Register</button>
        </form>
        <p class="text-center mt-3">
            <a href="{% url 'login' %}">Back to Login</a>
        </p>
    </div>
</div>
<script>
    // Show/hide department field based on user type
    document.getElementById('user_type').addEventListener('change', function() {
        const departmentField = document.getElementById('department_field');
        departmentField.style.display = this.value === 'teacher' ? 'block' : 'none';
    });
</script>
{% endblock %}
